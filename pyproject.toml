[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-prep-tool"
version = "1.0.0"
description = "Desktop CSV data preparation tool built with PyQt6 and pandas, focusing on transforming data into binary matrix form."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Gregor Vandak", email = "gregor.vandak@email.com"}]

license = {text = "MIT"}
keywords = ["data preparation", "csv", "binary matrix", "PyQt6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyQt6>=6.6,<7",
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[project.scripts]
data-prep-tool = "data_prep_tool.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["data_prep_tool*"]

[tool.setuptools.package-data]
data_prep_tool = ["app_icon.png"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
